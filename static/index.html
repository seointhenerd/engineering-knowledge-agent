<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Engineering Knowledge Agent</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f1117;
      color: #e2e8f0;
      font-family: 'SF Mono', 'Fira Code', 'Menlo', monospace;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      padding: 16px 24px;
      border-bottom: 1px solid #1e2433;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #22d3a5;
      box-shadow: 0 0 6px #22d3a5;
    }

    header h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #94a3b8;
      text-transform: uppercase;
    }

    #doc-list {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    #doc-list .doc-label {
      font-size: 11px;
      color: #475569;
      letter-spacing: 0.04em;
    }

    #doc-list .doc-chip {
      font-size: 11px;
      padding: 2px 10px;
      border-radius: 999px;
      background: #1a1f2e;
      border: 1px solid #2d3748;
      color: #64748b;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }

    #chat > * {
      width: 100%;
      max-width: 720px;
    }

    .bubble {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.65;
      word-break: break-word;
    }

    .bubble.user {
      background: #1e3a5f;
      color: #bfdbfe;
      border-bottom-right-radius: 3px;
      white-space: pre-wrap;
    }

    /* user wrapper: full width, bubbles pushed to right */
    .user-wrap {
      display: flex;
      justify-content: flex-end;
    }

    /* agent bubble wrapper — needed for copy button positioning */
    .agent-wrap {
      position: relative;
    }

    .agent-wrap:hover .copy-btn { opacity: 1; }

    .copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      opacity: 0;
      transition: opacity 0.15s;
      background: #2d3748;
      border: 1px solid #3d4f63;
      border-radius: 6px;
      padding: 4px 6px;
      cursor: pointer;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-family: inherit;
    }

    .copy-btn:hover { background: #374151; color: #e2e8f0; }
    .copy-btn.copied { color: #22d3a5; border-color: #22d3a550; }

    .copy-btn svg { width: 12px; height: 12px; flex-shrink: 0; }

    .bubble.agent {
      background: #1a1f2e;
      color: #e2e8f0;
      border: 1px solid #1e2433;
      border-bottom-left-radius: 3px;
    }

    /* markdown styles inside agent bubble */
    .bubble.agent strong { color: #f1f5f9; font-weight: 700; }
    .bubble.agent em { color: #cbd5e1; font-style: italic; }
    .bubble.agent code {
      background: #0f1117;
      border: 1px solid #2d3748;
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 12px;
      color: #22d3a5;
    }
    .bubble.agent pre {
      background: #0f1117;
      border: 1px solid #2d3748;
      border-radius: 6px;
      padding: 10px 14px;
      overflow-x: auto;
      margin: 8px 0;
    }
    .bubble.agent pre code {
      background: none;
      border: none;
      padding: 0;
      color: #e2e8f0;
    }
    .bubble.agent ul, .bubble.agent ol {
      padding-left: 20px;
      margin: 6px 0;
    }
    .bubble.agent li { margin: 3px 0; }
    .bubble.agent p { margin: 6px 0; }
    .bubble.agent p:first-child { margin-top: 0; }
    .bubble.agent p:last-child { margin-bottom: 0; }

    .bubble.thinking {
      align-self: flex-start;
      background: #1a1f2e;
      border: 1px solid #1e2433;
      color: #475569;
      font-style: italic;
      font-size: 12px;
    }

    .tools-used {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tool-tag {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #0f2a1e;
      color: #22d3a5;
      border: 1px solid #22d3a530;
      letter-spacing: 0.04em;
    }

    #input-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 16px 24px;
      border-top: 1px solid #1e2433;
      background: #0f1117;
    }

    #question {
      flex: 1;
      max-width: 680px;
      background: #1a1f2e;
      border: 1px solid #2d3748;
      border-radius: 8px;
      color: #e2e8f0;
      font-family: inherit;
      font-size: 13px;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.15s;
      resize: none;
      height: 44px;
      line-height: 1.5;
    }

    #question:focus { border-color: #22d3a5; }
    #question::placeholder { color: #475569; }

    #send {
      background: #22d3a5;
      color: #0f1117;
      border: none;
      border-radius: 8px;
      padding: 0 20px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
      white-space: nowrap;
    }

    #send:hover { opacity: 0.85; }
    #send:disabled { opacity: 0.35; cursor: not-allowed; }

    /* scrollbar */
    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: #2d3748; border-radius: 2px; }
  </style>
</head>
<body>

<header>
  <div class="dot"></div>
  <h1>Engineering Knowledge Agent</h1>
  <div id="doc-list"><span class="doc-label">docs:</span></div>
</header>

<div id="chat"></div>

<div id="input-row">
  <textarea id="question" placeholder="Ask anything about your engineering documents…" rows="1"></textarea>
  <button id="send">Send</button>
</div>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('question');
  const sendBtn = document.getElementById('send');

  function addBubble(text, role, toolsUsed = []) {
    const isAgent = role === 'agent';
    const wrap = document.createElement('div');
    wrap.className = isAgent ? 'agent-wrap' : 'user-wrap';

    const bubble = document.createElement('div');
    bubble.className = `bubble ${role}`;

    if (isAgent) {
      bubble.innerHTML = marked.parse(text);

      const copyBtn = document.createElement('button');
      copyBtn.className = 'copy-btn';
      copyBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span>Copy</span>`;
      copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(text).then(() => {
          copyBtn.classList.add('copied');
          copyBtn.querySelector('span').textContent = 'Copied!';
          setTimeout(() => {
            copyBtn.classList.remove('copied');
            copyBtn.querySelector('span').textContent = 'Copy';
          }, 2000);
        });
      });
      wrap.appendChild(copyBtn);
    } else {
      bubble.textContent = text;
    }

    wrap.appendChild(bubble);

    if (toolsUsed.length > 0) {
      const tagsRow = document.createElement('div');
      tagsRow.className = 'tools-used';
      toolsUsed.forEach(t => {
        const tag = document.createElement('span');
        tag.className = 'tool-tag';
        tag.textContent = t;
        tagsRow.appendChild(tag);
      });
      wrap.appendChild(tagsRow);
    }

    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
    return bubble;
  }

  async function sendMessage() {
    const question = input.value.trim();
    if (!question) return;

    input.value = '';
    input.style.height = '44px';
    sendBtn.disabled = true;

    addBubble(question, 'user');

    const thinkingWrap = document.createElement('div');
    const thinkingBubble = document.createElement('div');
    thinkingBubble.className = 'bubble thinking';
    thinkingBubble.textContent = 'thinking…';
    thinkingWrap.appendChild(thinkingBubble);
    chat.appendChild(thinkingWrap);
    chat.scrollTop = chat.scrollHeight;

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question }),
      });

      thinkingWrap.remove();

      if (!res.ok) {
        addBubble(`Error ${res.status}: ${res.statusText}`, 'agent');
        return;
      }

      const data = await res.json();
      addBubble(data.answer, 'agent', data.tools_used);
    } catch (err) {
      thinkingWrap.remove();
      addBubble(`Network error: ${err.message}`, 'agent');
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // Auto-grow textarea
  input.addEventListener('input', () => {
    input.style.height = '44px';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  // Load document list into header on page load
  fetch('/documents')
    .then(r => r.json())
    .then(data => {
      const list = document.getElementById('doc-list');
      if (data.documents.length === 0) return;
      data.documents.forEach(name => {
        const chip = document.createElement('span');
        chip.className = 'doc-chip';
        chip.textContent = name;
        list.appendChild(chip);
      });
    })
    .catch(() => {});
</script>
</body>
</html>
